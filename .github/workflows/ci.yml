name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (node ${{ matrix.node }})
    # Pinned rather than `-latest`: the image moves on a schedule nobody here controls.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # Both legs report even when one fails; a version-specific failure is why a matrix exists.
      fail-fast: false
      matrix:
        # The floor this package advertises in `engines`, and the current LTS. A range would let
        # setup-node install whatever the runner happens to have cached.
        node: ['22.19.0', '26']
    steps:
      # Pinned by commit: a major tag can be moved to different code. The tag is a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Fails when the lockfile and package.json disagree, which is the point of committing it.
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run vendor:check
