name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Reads engines.node from package.json, so the version lives in one place.
          node-version-file: package.json
          cache: npm
      # Fails when the lockfile and package.json disagree, which is the point of committing it.
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run vendor:check
